# @package _global_
# Group A: FlashSAC on the iLQR dynamics-resolved LAFAN1 reference (no BC).
# Produced from data/lafan1 by scripts/motion/lafan_ilqr.py; the source
# dataset stays untouched.
defaults:
  - /task/g1_sonic/mujoco
  - _self_

training:
  sim_backend: mujoco
env:
  commands:
    motion:
      params:
        motion_file: data/sonic/robot_filtered
        smpl_motion_file: data/sonic/smpl_filtered
        motion_store_file: data/sonic/packed
        adaptive_kernel_size: 3
        adaptive_uniform_ratio: 0.3
        adaptive_alpha: 0.05
        adaptive_failure_rate_max_over_mean: 30.0