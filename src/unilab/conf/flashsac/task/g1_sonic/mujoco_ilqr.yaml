# @package _global_
# Group A: FlashSAC on the iLQR dynamics-resolved LAFAN1 reference (no BC).
# Produced from data/lafan1 by scripts/motion/mocap2ilqr.py; the source
# dataset stays untouched.
defaults:
  - /task/g1_sonic/mujoco
  - _self_

training:
  sim_backend: mujoco
env:
  commands:
    motion:
      params:
        motion_file: data/lafan1_ilqr/robot_filtered
        smpl_motion_file: data/lafan1_ilqr/smpl_filtered
        motion_store_file: data/lafan1_ilqr/packed
