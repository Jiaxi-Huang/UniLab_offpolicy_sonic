# @package algo.sonic.model
# Same encoder -> FSQ -> decoder topology as release, with smaller widths.
num_future_frames: 1
num_tokens: 1
token_dim: 8
fsq_levels: 16
g1_frame_dim: 64
smpl_frame_dim: 84
action_dim: 29
# SONIC FlashSAC policy/critic trunk: per-block widths in
# SonicModelConfig.actor_hidden_dims / critic_hidden_dims.
actor_hidden_dims: [128, 128]
critic_hidden_dims: [128, 128]
g1_encoder_hidden_dims: [256, 128]
teleop_encoder_hidden_dims: [256, 128]
smpl_encoder_hidden_dims: [256, 128]
g1_motion_decoder_hidden_dims: [256, 128]
g1_control_decoder_hidden_dims: [512, 256]
