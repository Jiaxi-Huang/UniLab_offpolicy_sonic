# @package algo.sonic.model
# LAFAN1 uses the same G1+SMPL observation contract as the release model.
# LAFAN1 is substantially smaller than the release motion collection, so use
num_future_frames: 10
num_tokens: 2
token_dim: 32
fsq_levels: 32
g1_frame_dim: 64
smpl_frame_dim: 84
action_dim: 29
# SONIC FlashSAC policy/critic trunk: per-block widths in
# SonicModelConfig.actor_hidden_dims / critic_hidden_dims.
actor_hidden_dims: [1024, 1024, 1024, 1024]
critic_hidden_dims: [1024, 1024, 1024, 1024]
g1_encoder_hidden_dims: [1024, 512, 512]
teleop_encoder_hidden_dims: [1024, 512, 512]
smpl_encoder_hidden_dims: [1024, 512, 512]
g1_motion_decoder_hidden_dims: [1024, 512, 512]
#used when play SONIC-NVIDIA checkpoint
g1_control_decoder_hidden_dims: [1024, 1024, 512, 512]
