# @package algo.sonic.model
# LAFAN1 uses the same G1+SMPL observation contract as the release model.
# LAFAN1 is substantially smaller than the release motion collection, so use
# an intermediate-capacity backbone: larger than the one/two-clip smoke model
# while avoiding the release model's 23M-parameter actor.
num_future_frames: 4
num_tokens: 2
token_dim: 8
fsq_levels: 32
g1_frame_dim: 64
smpl_frame_dim: 84
action_dim: 29
actor_hidden_dim: 256
critic_hidden_dim: 256
g1_encoder_hidden_dims: [512, 256]
smpl_encoder_hidden_dims: [512, 256]
g1_motion_decoder_hidden_dims: [512, 256]
g1_control_decoder_hidden_dims: [1024, 512]
